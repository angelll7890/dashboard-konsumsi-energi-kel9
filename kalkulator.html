<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Konsumsi Energi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container py-4">

<h1 class="text-center mb-4">
⚡ Dashboard Konsumsi Energi
</h1>

<div class="card p-3 mb-4">

<div class="row">

<div class="col-md-3">
<input id="alat" class="form-control" placeholder="Nama Alat">
</div>

<div class="col-md-3">
<input id="daya" type="number" class="form-control" placeholder="Daya (W)">
</div>

<div class="col-md-3">
<input id="jumlah" type="number" class="form-control" placeholder="Jumlah">
</div>

<div class="col-md-3">
<input id="jam" type="number" class="form-control" placeholder="Jam/Hari">
</div>

</div>

<button class="btn btn-primary mt-3" onclick="tambahAlat()">
Tambah Alat
</button>

</div>

<div class="card p-3 mb-4">

<h4>Daftar Peralatan</h4>

<table class="table">

<thead>
<tr>
<th>Nama</th>
<th>Daya</th>
<th>Jumlah</th>
<th>Jam</th>
</tr>
</thead>

<tbody id="tabelAlat"></tbody>

</table>

</div>

<div class="row">

<div class="col-md-3">
<div class="card dashboard-card">
<h5>Total Alat</h5>
<h2 id="totalAlat">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card dashboard-card">
<h5>Energi/Hari</h5>
<h2 id="energiHarian">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card dashboard-card">
<h5>Energi/Bulan</h5>
<h2 id="energiBulanan">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card dashboard-card">
<h5>Biaya/Bulan</h5>
<h2 id="biayaBulanan">0</h2>
</div>
</div>

</div>

<div class="card p-4 mt-4">
<h4>Grafik Konsumsi Energi</h4>
<canvas id="myChart"></canvas>
</div>

<div class="card p-4 mt-4">

<h4>Estimasi Emisi CO₂</h4>

<p id="co2"></p>

</div>

<div class="card p-4 mt-4">

<h4>Ranking Konsumsi Energi</h4>

<ol id="ranking"></ol>

</div>

<div class="card p-4 mt-4">

<h4>Struk Perhitungan</h4>

<pre id="struk"></pre>

<button class="btn btn-success"
onclick="downloadPDF()">
Download PDF
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
